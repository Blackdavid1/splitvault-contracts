name: Deploy to Testnet

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install stellar-cli
        shell: bash
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v25.2.0/stellar-cli-25.2.0-x86_64-unknown-linux-gnu.tar.gz |
            tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build contract (release)
        run: stellar contract build --locked --package split

      - name: Configure testnet identity
        run: stellar keys generate deployer --network testnet

      - name: Fund deployer account via Friendbot
        run: |
          ADDR=$(stellar keys address deployer)
          echo "Funding $ADDR via Friendbot..."
          curl -s -f "https://friendbot.stellar.org?addr=$ADDR" > /dev/null
          echo "Account funded."

      - name: Deploy contract
        run: |
          stellar contract deploy \
            --wasm target/wasm32v1-none/release/split.wasm \
            --source deployer \
            --network testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"
