name: Deploy to Testnet

on:
  workflow_dispatch:
    inputs:
      usdc_token:
        description: Testnet USDC token contract address
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install stellar-cli
        run: cargo +stable install --locked stellar-cli

      - name: Build contract (release)
        env:
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: 0
        run: cargo +stable build --locked --target wasm32v1-none --release --package split --features testnet-constructor

      - name: Configure testnet identity
        run: stellar keys generate deployer --network testnet

      - name: Fund deployer account via Friendbot
        run: |
          ADDR=$(stellar keys address deployer)
          echo "Funding $ADDR via Friendbot..."
          curl -s -f "https://friendbot.stellar.org?addr=$ADDR" > /dev/null
          echo "Account funded."

      - name: Deploy and initialize contract
        id: deploy
        env:
          USDC_TOKEN: ${{ inputs.usdc_token }}
        run: |
          ADDR=$(stellar keys address deployer)
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32v1-none/release/split.wasm \
            --source-account deployer \
            --network testnet \
            -- \
            --admin "$ADDR" \
            --usdc_token "$USDC_TOKEN")
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed and initialized $CONTRACT_ID"
