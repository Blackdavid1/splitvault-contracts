name: Deploy to Testnet

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install stellar-cli
        run: |
          cargo install --locked --version 28.1.0 stellar-cli
          stellar --version

      - name: Build contract (release)
        run: stellar contract build --package split

      - name: Configure testnet identity
        run: stellar keys generate deployer --network testnet

      - name: Fund deployer account via Friendbot
        run: |
          ADDR=$(stellar keys address deployer)
          echo "Funding $ADDR via Friendbot..."
          curl -s -f "https://friendbot.stellar.org?addr=$ADDR" > /dev/null
          echo "Account funded."

      - name: Deploy contract
        shell: bash
        run: |
          wasm=target/wasm32v1-none/release/split.wasm
          contract_id=$(stellar contract deploy \
            --wasm "$wasm" \
            --source deployer \
            --network testnet)
          echo "Deployed contract $contract_id"
          bash scripts/testnet-deployment-manifest.sh "$contract_id" "$GITHUB_SHA" "$wasm" \
            > testnet-deployment.json

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: testnet-deployment
          path: testnet-deployment.json
          if-no-files-found: error
