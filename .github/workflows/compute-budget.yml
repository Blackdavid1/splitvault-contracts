name: Compute Budget Check

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: never
  SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: 0

jobs:
  budget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32v1-none

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-compute-budget-1.100.0-${{ hashFiles('Cargo.lock') }}

      - name: Build split contract WASM
        run: cargo build --locked --release -p split --target wasm32v1-none

      - name: Run compute budget fixtures
        env:
          COMPUTE_BUDGET_WASM: ${{ github.workspace }}/target/wasm32v1-none/release/split.wasm
        run: cargo test --locked -p split compute_budget_measurements -- --ignored --nocapture > budget_output.txt 2>&1 || { cat budget_output.txt; exit 1; }

      - name: Report and enforce instruction budgets
        shell: bash
        run: python3 .github/scripts/compute-budget.py < budget_output.txt | tee budget_report.md "$GITHUB_STEP_SUMMARY"

      - name: Post budget comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: compute-budget
          path: budget_report.md
