name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify testnet deployment manifest fixture
        run: bash scripts/test-testnet-deployment-manifest.sh

      - name: Run tests
        run: cargo test --workspace

      - name: Storage key snapshot test
        run: cargo test -p split storage_snapshot

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: |
          cargo install --locked --version 0.13.2 cargo-fuzz
          cargo fuzz --version

      - name: Check locked fuzz dependencies
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

      - name: Fuzz create_invoice (60s)
        run: cargo fuzz run fuzz_create_invoice -- -max_total_time=60

      - name: Fuzz pay (60s)
        run: cargo fuzz run fuzz_pay -- -max_total_time=60

      - name: Fuzz release (60s)
        run: cargo fuzz run fuzz_release -- -max_total_time=60

      - name: Fuzz refund (60s)
        run: cargo fuzz run fuzz_refund -- -max_total_time=60

      - name: Fuzz sequence (60s)
        run: cargo fuzz run fuzz_sequence -- -max_total_time=60

      - name: Verify fuzz lockfile is unchanged
        if: always()
        run: git diff --exit-code -- fuzz/Cargo.lock
