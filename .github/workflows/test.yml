name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: 0

jobs:
  package-tests:
    name: Test ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [dashboard, factory, invoice-escrow, registry, split]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.package }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Run package tests
        run: cargo test --locked -p ${{ matrix.package }}

      - name: Storage key snapshot test
        if: matrix.package == 'split'
        run: cargo test --locked -p split storage_snapshot

  test:
    runs-on: ubuntu-latest
    needs: package-tests
    if: ${{ always() }}
    steps:
      - name: Require every package suite to pass
        env:
          PACKAGE_TESTS_RESULT: ${{ needs.package-tests.result }}
        run: test "$PACKAGE_TESTS_RESULT" = success

  fuzz:
    name: Fuzz ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_create_invoice
          - fuzz_pay
          - fuzz_release
          - fuzz_refund
          - fuzz_sequence
          - fuzz_fee_deduct
          - fuzz_ratio_validation
          - fuzz_split_arithmetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2

      - name: Verify locked fuzz dependencies
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null

      - name: Fuzz target (60s)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60
